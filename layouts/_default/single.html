{{ define "main" }}
  <article class="article">
    <header class="article-header">
      <a class="back" href="{{ "posts/" | relURL }}">返回文章列表</a>
      <h1>{{ .Title }}</h1>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
    </header>
    <div class="content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
